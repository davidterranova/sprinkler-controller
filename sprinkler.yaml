# =============================================================================
#  esp-sprinkler -- v0 BENCH configuration
#
#  This is the roadmap's v0: an ESP32, a relay board, and LEDs where the
#  solenoids will go. Four zones plus a master, the stock `sprinkler` component
#  for sequencing, a scheduler whose decisions are unit-tested on a host, and an
#  independent guard that closes the outputs when the application stops proving
#  it is alive.
#
#  **No water. No valve. Nothing is plumbed.** The roadmap's guiding principle
#  is that plumbing is the irreversible part, and the safety layer has to be
#  proven on a bench first. Two things gate connecting a valve:
#
#    * bench tests T1/T3/T4 on the relay board (verification E1-E3), and
#    * E6 -- prove the deadman de-energises the rail under a *deliberately
#      hung* firmware, not by pulling power, which any design passes.
#
#  See docs/21-bench-procedure.md for how to run the v0 exit-criteria tests.
#
#  Board (read off the hardware, 2026-09-05):
#    ESP32-D0WD-V3 rev v3.1, dual core, 40 MHz crystal, 4 MB flash,
#    MAC 10:06:1c:83:b9:94. Classic ESP32 => 8 PCNT units for the flow meter.
#
#  Naming: English throughout -- repo, device and HA entities. This diverges
#  from docs/08-home-assistant.md, which proposed French entity names to match
#  the existing pool controller. English is the owner's call; the HA doc's
#  entity_id examples should be read as illustrative.
# =============================================================================

substitutions:
  node_name: sprinkler-controller
  friendly_name: Sprinkler Controller

  # --- pin map ------------------------------------------------------------
  # The all-direct fallback set from docs/05-hardware.md, not the PCF8574 path:
  # on the bench the guard must be able to hard-close every zone pin itself,
  # and it can only write pins it owns directly. See the note in
  # packages/zones.yaml.
  #
  # NEVER use GPIO 0, 1, 2, 3, 5, 6-11, 12 or 15. GPIO12 (MTDI) is the one that
  # must be respected absolutely: every relay IN line carries a 1 kOhm pull-up,
  # which on MTDI selects a 1.8 V VDD_SDIO at reset, browns out the 3.3 V flash,
  # and the board will not boot or flash at all [V]. The guard's config schema
  # rejects all of them rather than trusting anyone to remember.
  zone_1_pin: GPIO32
  zone_2_pin: GPIO33
  zone_3_pin: GPIO25
  zone_4_pin: GPIO26
  master_pin: GPIO17
  deadman_pin: GPIO13

  # true for a standard opto-isolated relay board, whose IN pins are pulled UP
  # through the board's own 1 kOhm. Combined with "during reset, all pins are
  # output-disabled" (ESP32 datasheet v5.3, A.1 note 9), that makes "booting,
  # absent, in reset, or with the wire fallen off" resolve to relay OFF by
  # construction, with no external components.
  #
  # ** Bench test T3 (verification E2) confirms this before it is trusted. **
  # "High/low trigger selectable" boards exist; set to high-trigger, everything
  # inverts. Set this to "false" only if you are driving LEDs straight from the
  # GPIOs with no relay board in between.
  relay_active_low: "true"

packages:
  base: !include packages/base.yaml
  safety: !include packages/safety.yaml
  zones: !include packages/zones.yaml
  scheduler: !include packages/scheduler.yaml
  ui: !include packages/ui.yaml
  # Fit the DS3231 and uncomment -- see the file's header for the two edits.
  # rtc: !include packages/rtc-ds3231.yaml

external_components:
  - source:
      type: local
      path: components
    components: [irrigation_core, irrigation_guard, irrigation_scheduler]
