# =============================================================================
#  Battery-backed RTC -- FR-1.3, and a v0 exit-criteria item
#
#  NOT included by default: it needs a DS3231 module on the I2C bus, and until
#  one is fitted a config that references it would leave the clock permanently
#  untrusted and no scheduled run would ever fire.
#
#  To enable, add this to the `packages:` block in sprinkler.yaml:
#
#      rtc: !include packages/rtc-ds3231.yaml
#
#  and change `time_id: device_time` to `time_id: rtc_time` in
#  packages/scheduler.yaml.
#
#  ## The DS3231 caveat, restated because it bites silently [V]
#
#  The DS3231 is not a natively supported ESPHome platform. The `ds1307`
#  platform works -- registers 0x00-0x06 are identical -- but ESPHome tests the
#  DS1307's **CH bit**, which is unused on a DS3231, and it cannot read the
#  DS3231's **OSF** oscillator-stop flag. So ESPHome can never detect "this RTC
#  lost time", and a dead backup cell can yield a plausible-looking WRONG time,
#  which is worse than an obviously invalid one.
#
#  Two mitigations, and v0 must prove both before this is trusted:
#    * the sanity band below -- an SNTP result that disagrees with the RTC by
#      more than the band is rejected (FR-1.4), and
#    * a monotonicity check against the last-known-good epoch, which is what
#      catches the dead-cell case the OSF flag would otherwise have caught.
#
#  Also note ESPHome writes 8 bytes from register 0x00, so **register 0x07 --
#  Alarm-1 seconds on a DS3231 -- gets written**. Harmless, provided the alarms
#  are never used.
#
#  The alternative is the natively supported PCF8563, which does expose a
#  voltage-low flag. The DS3231's TCXO is the better oscillator (+/-2 ppm over
#  0-40 C, ~63 s/year, against the DS1307's +/-20-50 ppm) and a garden box
#  swings 50 K, which is exactly why the TCXO is worth keeping.
#
#  Run the whole I2C bus at 3.3 V and fit a plain CR2032: on a ZS-042 module the
#  LIR2032 charging circuit does not function at 3.3 V, and LIR2032 cells are
#  stocked by neither Reichelt nor TME [V].
# =============================================================================

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  id: bus_a

time:
  - platform: ds1307
    id: rtc_time
    address: 0x68
    update_interval: never   # read once at boot; SNTP corrects the RTC, not vice versa
    timezone: !secret sprinkler_timezone

interval:
  # Read the RTC once, early, so the schedule can run before Wi-Fi associates.
  - interval: 60s
    then:
      - if:
          condition:
            lambda: "return !id(rtc_time).now().is_valid();"
          then:
            - ds1307.read_time: rtc_time

script:
  - id: sync_rtc_from_sntp
    then:
      # FR-1.4: an SNTP result deviating from the RTC by more than the band is
      # REJECTED, and never triggers a run by itself. The band is deliberately
      # generous -- a TCXO drifts ~63 s/year, so anything beyond a few minutes
      # is a fault, not drift.
      - lambda: |-
          const auto sntp_now = id(device_time).now();
          const auto rtc_now = id(rtc_time).now();
          if (!sntp_now.is_valid())
            return;
          if (rtc_now.is_valid()) {
            const long long delta = (long long) sntp_now.timestamp - (long long) rtc_now.timestamp;
            const long long band = 600;  // 10 minutes
            if (delta > band || delta < -band) {
              ESP_LOGE("rtc", "SNTP disagrees with the RTC by %lld s -- rejected, NOT written", delta);
              return;
            }
          }
      - ds1307.write_time: rtc_time
